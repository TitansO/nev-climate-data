services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: nev-climate-data-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      # $ is doubled ($$) below: docker-compose interpolates single $ itself,
      # and this default value is a regex whose literal $ end-anchors would
      # otherwise be swallowed as (empty) variable references.
      CORS_ALLOWED_ORIGIN_REGEX: ${CORS_ALLOWED_ORIGIN_REGEX:-^https?://localhost:8123$$|^https://[a-z0-9-]+-8123\.app\.github\.dev$$}
      REDIS_DSN: ${REDIS_DSN:-redis://redis:6379}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - nev-network

  database:
    image: timescale/timescaledb:latest-pg16
    container_name: nev-climate-data-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nev-network

  # A2.5: dedicated cache backend for the analytics aggregates (see
  # backend/config/packages/cache.yaml, pool "cache.analytics"). Not used
  # for anything else in the project - the login-throttling rate limiter
  # (A1.4) keeps using the default filesystem-backed cache pool.
  redis:
    image: redis:7-alpine
    container_name: nev-climate-data-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nev-network

  # --- Volet B (B1.1) : infrastructure du pipeline de données réelles ------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nev-climate-data-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - nev-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nev-climate-data-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - nev-network

  postgres-airflow:
    image: postgres:16
    container_name: nev-climate-data-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - nev-network

  airflow:
    image: apache/airflow:2.9.0
    container_name: nev-climate-data-airflow
    restart: unless-stopped
    depends_on:
      - postgres-airflow
      - kafka
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/pipeline/dags
      _PIP_ADDITIONAL_REQUIREMENTS: "kafka-python==2.0.2 psycopg2-binary==2.9.9 requests==2.32.3 pycountry==24.6.1"
      PIPELINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    volumes:
      - ./pipeline:/opt/airflow/pipeline
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8081:8080"
    command: standalone
    networks:
      - nev-network

  minio:
    image: minio/minio
    container_name: nev-climate-data-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - nev-network

  # Visual browser for Kafka topics/messages (not part of the pipeline
  # architecture itself - added for local observability, per Serge's
  # explicit request while reviewing the B1.1 plan).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nev-climate-data-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: nev-climate-data
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      # 8082 is taken on this machine by an unrelated, already-running
      # Observatoire CIMA container (cima_flink_jobmanager) - confirmed via
      # `docker ps` during B1.1 Task 1. Using 8083 instead.
      - "8083:8080"
    networks:
      - nev-network

networks:
  nev-network:
    driver: bridge

volumes:
  postgres_data:
  backend_vendor:
  redis_data:
  airflow_postgres_data:
  airflow_logs:
  minio_data:
