services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: nev-climate-data-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      # $ is doubled ($$) below: docker-compose interpolates single $ itself,
      # and this default value is a regex whose literal $ end-anchors would
      # otherwise be swallowed as (empty) variable references.
      CORS_ALLOWED_ORIGIN_REGEX: ${CORS_ALLOWED_ORIGIN_REGEX:-^https?://localhost:8123$$|^https://[a-z0-9-]+-8123\.app\.github\.dev$$}
      REDIS_DSN: ${REDIS_DSN:-redis://redis:6379}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - nev-network

  # A2.3: consumes the async export queue (Symfony Messenger, Doctrine
  # transport - see backend/config/packages/messenger.yaml). Same image as
  # "backend" (build layers are shared/cached), only the command differs:
  # no Apache, no exposed port, just a long-running console worker.
  # --time-limit lets the process recycle periodically; restart:
  # unless-stopped keeps it effectively continuous.
  backend-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: nev-climate-data-backend-worker
    restart: unless-stopped
    command: php bin/console messenger:consume async -vv --time-limit=3600 --memory-limit=256M
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOWED_ORIGIN_REGEX: ${CORS_ALLOWED_ORIGIN_REGEX:-^https?://localhost:8123$$|^https://[a-z0-9-]+-8123\.app\.github\.dev$$}
      REDIS_DSN: ${REDIS_DSN:-redis://redis:6379}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - nev-network

  database:
    image: timescale/timescaledb:latest-pg16
    container_name: nev-climate-data-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nev-network

  # A2.5: dedicated cache backend for the analytics aggregates (see
  # backend/config/packages/cache.yaml, pool "cache.analytics"). Not used
  # for anything else in the project - the login-throttling rate limiter
  # (A1.4) keeps using the default filesystem-backed cache pool.
  redis:
    image: redis:7-alpine
    container_name: nev-climate-data-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nev-network

  # --- Volet B (B1.1) : infrastructure du pipeline de données réelles ------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nev-climate-data-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - nev-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nev-climate-data-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - nev-network

  postgres-airflow:
    image: postgres:16
    container_name: nev-climate-data-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - nev-network

  airflow:
    image: apache/airflow:2.9.0
    container_name: nev-climate-data-airflow
    restart: unless-stopped
    depends_on:
      - postgres-airflow
      - kafka
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/pipeline/dags
      _PIP_ADDITIONAL_REQUIREMENTS: "kafka-python-ng==2.2.3 psycopg2-binary==2.9.9 requests==2.32.3 pycountry==24.6.1 google-genai==2.20.0 minio==7.2.20 pypdf==6.16.2"
      PIPELINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      # Airflow puts DAGS_FOLDER itself (.../pipeline/dags) on sys.path, not its parent - a DAG
      # importing `from pipeline.collectors... import ...` (a package one level above DAGS_FOLDER)
      # otherwise fails with ModuleNotFoundError: No module named 'pipeline' (confirmed live
      # while building Task 8). /opt/airflow is where ./pipeline is mounted, so this makes the
      # `pipeline` package importable the same way it already is inside the funding-validator
      # and pipeline-tools images (PYTHONPATH=/app there, via pipeline/Dockerfile).
      PYTHONPATH: /opt/airflow
      IATI_API_KEY: ${IATI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./pipeline:/opt/airflow/pipeline
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8081:8080"
    command: standalone
    networks:
      - nev-network

  minio:
    image: minio/minio
    container_name: nev-climate-data-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - nev-network

  # Visual browser for Kafka topics/messages (not part of the pipeline
  # architecture itself - added for local observability, per Serge's
  # explicit request while reviewing the B1.1 plan).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nev-climate-data-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: nev-climate-data
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      # 8082 is taken on this machine by an unrelated, already-running
      # Observatoire CIMA container (cima_flink_jobmanager) - confirmed via
      # `docker ps` during B1.1 Task 1. Using 8083 instead.
      - "8083:8080"
    networks:
      - nev-network

  # Permanent Kafka consumer: nev.funding.raw -> validate/upsert -> TimescaleDB, publishing
  # to nev.funding.valides/nev.funding.rejets (B1.1). Also doubles as the runner for pipeline/
  # one-off commands and tests - `docker compose run --rm funding-validator <anything>`
  # overrides `command:` below regardless of this service being always-on.
  funding-validator:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: nev-climate-data-funding-validator
    restart: unless-stopped
    environment:
      PIPELINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IATI_API_KEY: ${IATI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: python -m pipeline.processors.funding_validator
    depends_on:
      - database
      - kafka
    networks:
      - nev-network

  # Permanent Kafka consumer: nev.emissions.raw -> validate/upsert -> TimescaleDB, publishing
  # to nev.emissions.valides/nev.emissions.rejets (B1.4). Separate service from
  # funding-validator - a different Kafka topic set and a different consumer group, so each
  # can be restarted/scaled independently.
  emission-validator:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: nev-climate-data-emission-validator
    restart: unless-stopped
    environment:
      PIPELINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: python -m pipeline.processors.emission_validator
    depends_on:
      - database
      - kafka
    networks:
      - nev-network

networks:
  nev-network:
    driver: bridge

volumes:
  postgres_data:
  backend_vendor:
  redis_data:
  airflow_postgres_data:
  airflow_logs:
  minio_data:
