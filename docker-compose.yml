services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: nev-climate-data-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      # $ is doubled ($$) below: docker-compose interpolates single $ itself,
      # and this default value is a regex whose literal $ end-anchors would
      # otherwise be swallowed as (empty) variable references.
      CORS_ALLOWED_ORIGIN_REGEX: ${CORS_ALLOWED_ORIGIN_REGEX:-^https?://localhost:8123$$|^https://[a-z0-9-]+-8123\.app\.github\.dev$$}
      REDIS_DSN: ${REDIS_DSN:-redis://redis:6379}
      # A3.1: config/packages/mercure.yaml resolves these through Symfony's
      # own env(default::...) processor (falls back to null if unset), so
      # this service works fine without them - only "mercure-publisher"
      # below actually calls HubInterface::publish(). Provided here too so
      # nothing in the main API would break if it ever did.
      MERCURE_URL: ${MERCURE_URL:-http://mercure/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost:3000/.well-known/mercure}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - nev-network

  # A2.3: consumes the async export queue (Symfony Messenger, Doctrine
  # transport - see backend/config/packages/messenger.yaml). Same image as
  # "backend" (build layers are shared/cached), only the command differs:
  # no Apache, no exposed port, just a long-running console worker.
  # --time-limit lets the process recycle periodically; restart:
  # unless-stopped keeps it effectively continuous.
  backend-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: nev-climate-data-backend-worker
    restart: unless-stopped
    command: php bin/console messenger:consume async -vv --time-limit=3600 --memory-limit=256M
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOWED_ORIGIN_REGEX: ${CORS_ALLOWED_ORIGIN_REGEX:-^https?://localhost:8123$$|^https://[a-z0-9-]+-8123\.app\.github\.dev$$}
      REDIS_DSN: ${REDIS_DSN:-redis://redis:6379}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - nev-network

  # A3.1: real-time hub (SSE, https://mercure.rocks/) - receives KPI
  # snapshots from "mercure-publisher" below and pushes them live to any
  # connected subscriber (the frontend's useMercureKpis() hook, A3.2, see
  # frontend/src/react/hooks/useMercureKpis.js). "anonymous" + "cors_origins
  # *": the one topic published here is already public data (same figures
  # as GET /api/analytics/hero-stats, PUBLIC_ACCESS) - no reason to require
  # a subscriber JWT, which a native EventSource couldn't send anyway (no
  # custom-header support). SERVER_NAME=":80" tells Caddy (the hub's
  # underlying server) to listen in plain HTTP on the container's own port
  # 80 rather than attempting automatic HTTPS/ACME, which would fail with
  # no real public domain.
  mercure:
    image: dunglas/mercure
    container_name: nev-climate-data-mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins *
    ports:
      - "3000:80"
    networks:
      - nev-network

  # A3.1: republishes a KPI snapshot to the hub above every 60s (see
  # backend/src/Command/PublishKpiSnapshotCommand.php's docblock for why
  # this is a periodic republish rather than a real change event). Same
  # image as "backend", only the command differs - same pattern as
  # "backend-worker" for messenger:consume.
  mercure-publisher:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: nev-climate-data-mercure-publisher
    restart: unless-stopped
    command: php bin/console app:mercure:publish-kpis
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      REDIS_DSN: ${REDIS_DSN:-redis://redis:6379}
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_started
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - nev-network

  database:
    image: timescale/timescaledb:latest-pg16
    container_name: nev-climate-data-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nev-network

  # A2.5: dedicated cache backend for the analytics aggregates (see
  # backend/config/packages/cache.yaml, pool "cache.analytics"). Not used
  # for anything else in the project - the login-throttling rate limiter
  # (A1.4) keeps using the default filesystem-backed cache pool.
  redis:
    image: redis:7-alpine
    container_name: nev-climate-data-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nev-network

  # A3.6: periodic pg_dump of the application database, uploaded to a
  # dedicated MinIO bucket "nev-climate-data-backups" (separate from
  # "nev-climate-data", the Volet B data lake bucket - see
  # docker/db-backup/backup.sh's docblock for why), with automatic
  # retention via MinIO's own ILM (no hand-rolled cleanup). Depends on
  # "minio" (defined further below, under Volet B) - Docker Compose
  # resolves the dependency graph regardless of declaration order in this
  # file. Restoration is manual/on-demand (docker/db-backup/restore.sh),
  # deliberately never automatic.
  db-backup:
    build:
      context: .
      dockerfile: docker/db-backup/Dockerfile
    container_name: nev-climate-data-db-backup
    restart: unless-stopped
    environment:
      PGHOST: database
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-nev-climate-data-backups}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - nev-network

  # --- Volet B (B1.1) : infrastructure du pipeline de données réelles ------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nev-climate-data-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - nev-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nev-climate-data-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - nev-network

  postgres-airflow:
    image: postgres:16
    container_name: nev-climate-data-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - nev-network

  airflow:
    image: apache/airflow:2.9.0
    container_name: nev-climate-data-airflow
    restart: unless-stopped
    depends_on:
      - postgres-airflow
      - kafka
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/pipeline/dags
      # pytest added here (2026-08-31 multi-task DAG refactor): the new
      # pipeline/tests/test_dag_*_tasks.py files import `from airflow import
      # DAG` at module level (they import the DAG modules directly), so they
      # cannot run inside the funding-validator image (no airflow package
      # there) - they run inside this container instead, which needs pytest.
      _PIP_ADDITIONAL_REQUIREMENTS: "kafka-python-ng==2.2.3 psycopg2-binary==2.9.9 requests==2.32.3 pycountry==24.6.1 google-genai==2.20.0 minio==7.2.20 pypdf==6.16.2 pytest==8.3.3"
      PIPELINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      # Airflow puts DAGS_FOLDER itself (.../pipeline/dags) on sys.path, not its parent - a DAG
      # importing `from pipeline.collectors... import ...` (a package one level above DAGS_FOLDER)
      # otherwise fails with ModuleNotFoundError: No module named 'pipeline' (confirmed live
      # while building Task 8). /opt/airflow is where ./pipeline is mounted, so this makes the
      # `pipeline` package importable the same way it already is inside the funding-validator
      # and pipeline-tools images (PYTHONPATH=/app there, via pipeline/Dockerfile).
      PYTHONPATH: /opt/airflow
      IATI_API_KEY: ${IATI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # B1.9: real email alerting on DAG task failure - see
      # pipeline/common/alerting.py and the 2026-09-01 spec.
      AIRFLOW_ALERT_EMAIL: ${AIRFLOW_ALERT_EMAIL}
      AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
      AIRFLOW__SMTP__SMTP_STARTTLS: "True"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__SMTP__SMTP_PORT: "587"
      AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW_ALERT_EMAIL}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW_SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW_ALERT_EMAIL}
    volumes:
      - ./pipeline:/opt/airflow/pipeline
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8081:8080"
    command: standalone
    networks:
      - nev-network

  minio:
    image: minio/minio
    container_name: nev-climate-data-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - nev-network

  # Visual browser for Kafka topics/messages (not part of the pipeline
  # architecture itself - added for local observability, per Serge's
  # explicit request while reviewing the B1.1 plan).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nev-climate-data-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: nev-climate-data
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      # 8082 is taken on this machine by an unrelated, already-running
      # Observatoire CIMA container (cima_flink_jobmanager) - confirmed via
      # `docker ps` during B1.1 Task 1. Using 8083 instead.
      - "8083:8080"
    networks:
      - nev-network

  # Permanent Kafka consumer: nev.funding.raw -> validate/upsert -> TimescaleDB, publishing
  # to nev.funding.valides/nev.funding.rejets (B1.1). Also doubles as the runner for pipeline/
  # one-off commands and tests - `docker compose run --rm funding-validator <anything>`
  # overrides `command:` below regardless of this service being always-on.
  funding-validator:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: nev-climate-data-funding-validator
    restart: unless-stopped
    environment:
      PIPELINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IATI_API_KEY: ${IATI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: python -m pipeline.processors.funding_validator
    depends_on:
      - database
      - kafka
    networks:
      - nev-network

  # Permanent Kafka consumer: nev.emissions.raw -> validate/upsert -> TimescaleDB, publishing
  # to nev.emissions.valides/nev.emissions.rejets (B1.4). Separate service from
  # funding-validator - a different Kafka topic set and a different consumer group, so each
  # can be restarted/scaled independently.
  emission-validator:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    container_name: nev-climate-data-emission-validator
    restart: unless-stopped
    environment:
      PIPELINE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: python -m pipeline.processors.emission_validator
    depends_on:
      - database
      - kafka
    networks:
      - nev-network

networks:
  nev-network:
    driver: bridge

volumes:
  postgres_data:
  backend_vendor:
  redis_data:
  airflow_postgres_data:
  airflow_logs:
  minio_data:
