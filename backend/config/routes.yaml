# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: routing.controllers

# These two routes are never actually resolved to a controller: the "login"
# and "api" firewalls' authenticators (json_login, refresh-jwt) intercept the
# request at kernel.request and return a response before controller
# resolution runs. The routes must still exist, though — routing itself
# happens before the firewall does, so without a matching route the router
# throws a 404 first and the authenticator never gets a chance to run.
api_auth_login:
    path: /api/auth/login
    methods: [POST]

api_auth_refresh:
    path: /api/auth/refresh
    methods: [POST]
