# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # A2.3 async export: where generated CSV/XLSX files land once the worker
    # finishes (App\Service\ExportService), read back by
    # FundingController::downloadExport() after an ownership check. Not
    # under public/ - never served directly by Apache, only ever streamed
    # through that authenticated endpoint.
    app.export_storage_dir: '%kernel.project_dir%/var/exports'
    # A2.13 / B3.3 point d'attention #55: where published reports' PDF files
    # live, read by App\Controller\ReportController::download(). Report.pdfFile
    # stores a "reports/..." relative path (see App\DataFixtures\ReportFixtures),
    # so this points at resources/ itself, not resources/reports/ - avoids a
    # doubled "reports/reports/" segment. Deliberately NOT under var/ (gitignored,
    # excluded from the Docker build context by .dockerignore - a real bug found
    # in production: files written there at fixture-load time never made it into
    # the deployed image, and Render's disk is ephemeral anyway, so every
    # download 404'd). resources/ is a real, git-tracked, Docker-image-shipped
    # directory - the same 4 placeholder PDFs exist on every environment without
    # ever needing fixtures to run against it. Not under public/ either - never
    # served directly by Apache, only ever streamed through the tracked
    # download endpoint.
    app.report_storage_dir: '%kernel.project_dir%/resources'
    # C2.1 / F5: base URL of the ai/ FastAPI service, read by App\Controller\
    # AiController to proxy POST /api/ai/ask - see docker-compose.yml's
    # "backend" service env for the real value.
    app.ai_service_url: '%env(AI_SERVICE_URL)%'
    # C3.8: shared secret checked by App\Controller\InternalAlertsController
    # (POST /api/internal/alerts/evaluate) - lets the "evaluation_alertes"
    # Airflow DAG (pipeline/dags/evaluation_alertes_dag.py) trigger
    # AlertEvaluationService daily over HTTP, since the `airflow` container
    # has no way to `docker exec` into `backend` (no Docker socket mounted,
    # unlike a real docker-outside-of-docker setup) - see the endpoint's own
    # docblock for the full reasoning.
    app.internal_trigger_token: '%env(INTERNAL_TRIGGER_TOKEN)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $exportStorageDir: '%app.export_storage_dir%'
            string $reportStorageDir: '%app.report_storage_dir%'
            string $aiServiceUrl: '%app.ai_service_url%'
            string $internalTriggerToken: '%app.internal_trigger_token%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

