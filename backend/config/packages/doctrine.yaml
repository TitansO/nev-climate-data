doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # TimescaleDB's extension owns catalog/internal schemas and sequences
        # (_timescaledb_catalog, _timescaledb_internal, _timescaledb_config,
        # _timescaledb_functions, _timescaledb_cache, timescaledb_information,
        # timescaledb_experimental). Without this filter, schema-diff and
        # schema-validate treat those as unmapped and try to drop/recreate
        # them. Exclude anything whose name starts with "timescaledb" or
        # "_timescaledb" from Doctrine's schema management.
        schema_filter: '~^(?!_?timescaledb).*~'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # A2.8: UNACCENT(expr) DQL function -> PostgreSQL's unaccent()
        # extension (see migration Version20260827160000), used by the
        # global search repositories for accent-insensitive matching.
        dql:
            string_functions:
                UNACCENT: App\Doctrine\DQL\UnaccentFunction
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
