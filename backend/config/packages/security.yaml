security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\Security\LoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            entry_point: jwt
            jwt: ~
            refresh-jwt:
                check_path: /api/auth/refresh
            # X-API-Key header authentication (A1.5), alongside JWT. Its
            # supports() only claims requests carrying that header, so JWT
            # bearer-token requests are unaffected.
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        # A2.3: must come before the /api/funding PUBLIC_ACCESS rule below -
        # access_control matches by prefix regex, so /api/funding/export
        # would otherwise also match ^/api/funding and inherit public access
        # instead of requiring authentication.
        - { path: ^/api/funding/export, roles: IS_AUTHENTICATED_FULLY }
        # A2.1: GET /api/funding is public read — a visitor with no account
        # can browse the dataset without a JWT or an API key.
        - { path: ^/api/funding, roles: PUBLIC_ACCESS }
        # A2.5: the analytics aggregates feed visualizations.html, which
        # itself has no login requirement - same reasoning as /api/funding.
        - { path: ^/api/analytics, roles: PUBLIC_ACCESS }
        # A2.8: every searched entity is already public data (see
        # App\Service\SearchService's docblock).
        - { path: ^/api/search, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Entity\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
