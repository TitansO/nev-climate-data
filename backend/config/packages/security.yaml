security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    # SuperAdmin inherits every Admin permission (and everything Admin
    # itself inherits) rather than needing every access_control/IsGranted
    # check duplicated for both roles - App\Controller\UserController is
    # the only place gated on ROLE_SUPER_ADMIN specifically, since only it
    # manages other users' accounts and roles.
    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/auth/login
            stateless: true
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\Security\LoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            entry_point: jwt
            jwt: ~
            refresh-jwt:
                check_path: /api/auth/refresh
            # X-API-Key header authentication (A1.5), alongside JWT. Its
            # supports() only claims requests carrying that header, so JWT
            # bearer-token requests are unaffected.
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator

    # Note: Only the *first* matching rule is applied
    #
    # Structuration des accès (2026-09-24) : jusqu'ici, la quasi-totalité
    # de la surface C1/C3 ci-dessous était volontairement PUBLIC_ACCESS
    # (voir l'historique git de ce fichier pour le raisonnement A2.x/C1.x/
    # C3.x d'origine, endpoint par endpoint - une décision d'audit
    # délibérée à l'époque). Décision produit explicite : un visiteur sans
    # compte doit pouvoir découvrir NEV (page d'accueil, statistiques
    # générales agrégées) mais pas reproduire le jeu de données ni utiliser
    # les fonctionnalités principales sans créer de compte. Tout /api/analytics/*
    # (y compris l'ancien hero-stats, désormais dupliqué en accès public via
    # GET /api/public/statistics) bascule donc sur ROLE_USER, sans
    # exception. GET /api/public/* est la nouvelle couche dédiée aux
    # aperçus publics (App\Controller\PublicController) - elle n'expose que
    # des agrégats ou des champs non sensibles, jamais un jeu de données
    # complet.
    access_control:
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        # Doit venir avant la règle générale /api/funding ci-dessous -
        # access_control ne retient que la première règle qui correspond,
        # donc toute exception doit précéder la règle générale de son
        # propre préfixe.
        - { path: ^/api/funding/export, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/funding, roles: ROLE_USER }
        - { path: ^/api/analytics, roles: ROLE_USER }
        - { path: ^/api/search, roles: ROLE_USER }
        - { path: ^/api/reports, roles: ROLE_USER }
        - { path: ^/api/institutions, roles: ROLE_USER }
        # C2.2 : doit venir avant la règle générale /api/opportunities
        # ci-dessous, même raisonnement que /api/funding/export ci-dessus.
        - { path: ^/api/opportunities/\d+/candidates, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/opportunities, roles: ROLE_USER }
        - { path: ^/api/countries, roles: ROLE_USER }
        - { path: ^/api/impact, roles: ROLE_USER }
        - { path: ^/api/sectors, roles: ROLE_USER }
        - { path: ^/api/blended, roles: ROLE_USER }
        - { path: ^/api/recommendations, roles: ROLE_USER }
        # C3.8: machine-to-machine trigger for the daily alerts DAG - no
        # JWT/API-key identity makes sense here, real authentication is the
        # shared-secret check inside App\Controller\InternalAlertsController
        # itself (X-Internal-Token, hash_equals).
        - { path: ^/api/internal/alerts/evaluate, roles: PUBLIC_ACCESS }
        # User management (create accounts, change roles, delete accounts)
        # is reserved to SuperAdmin - must come before the catch-all below,
        # same reasoning as /api/funding/export above it in this file.
        - { path: ^/api/users, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            App\Entity\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
