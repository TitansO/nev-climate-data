<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php

        # Apache strips the Authorization header from the PHP environment by
        # default (historical security default). Without this, every JWT
        # bearer-token and X-API-Key request fails with a false "token not
        # found" — invisible in PHPUnit's WebTestCase, which calls the
        # Symfony kernel directly and never goes through Apache.
        CGIPassAuth On
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
