stages:
  - test
  - build

# Audit de robustesse 2026-09-24 : aucune verification automatisee des
# dependances n'existait dans ce pipeline - composer audit / npm audit
# n'avaient ete lances qu'a la main, une fois, lors de l'audit lui-meme
# (0 vulnerabilite trouvee des deux cotes a cette date). Ajoute ici pour
# que toute regression future (nouvelle dependance vulnerable) fasse
# reellement echouer le pipeline, pas seulement lors d'un audit manuel
# occasionnel - repond directement au constat de l'audit ("aucun gate CI
# ne bloque un probleme de securite critique").
composer_audit:
  stage: test
  image: php:8.4-cli
  before_script:
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - cd backend
    - composer install --no-interaction --no-progress --prefer-dist --no-scripts
    - composer audit

pip_audit_ai:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd ai
    - pip install --no-cache-dir -r requirements.txt pip-audit
  script:
    - pip-audit --strict

pip_audit_pipeline:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd pipeline
    - pip install --no-cache-dir -r requirements.txt pip-audit
  script:
    - pip-audit --strict

# Audit post-C3 2026-10-02 (P-03) : le frontend n'avait aucun job CI -
# contrairement a composer_audit/pip_audit_*/phpunit/ai_tests/pipeline_tests
# ci-dessus, un commit qui cassait `npm run build` ou introduisait une
# dependance vulnerable n'etait jamais bloque avant Netlify (qui se
# deploie depuis le code source, independamment de ce pipeline - voir le
# commentaire de build_and_push_image plus bas). Deja arrive une fois en
# pratique (README section A3.8 : Netlify a servi un HTML perime
# pendant un moment sans qu'aucune alerte CI ne le signale). image node:20,
# meme version que frontend/.nvmrc.
frontend_build:
  stage: test
  image: node:20
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm audit
    - npm run build

phpunit:
  stage: test
  image: php:8.4-cli
  services:
    - name: timescale/timescaledb:latest-pg16
      alias: database
    # A2.5: the "cache.analytics" pool (config/packages/cache.yaml) and
    # AnalyticsControllerTest both need a real Redis - added here for the
    # same reason as the PHP extensions below (see the README's pitfall
    # list, point 9): this job runs in a generic php:8.4-cli image, not the
    # project's own docker-compose stack, so nothing here is inherited
    # automatically from docker-compose.yml.
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: nev_climate_data_ci
    POSTGRES_USER: nev_ci
    POSTGRES_PASSWORD: nev_ci_password
    DATABASE_URL: "postgresql://nev_ci:nev_ci_password@database:5432/nev_climate_data_ci?serverVersion=16&charset=utf8"
    REDIS_DSN: "redis://redis:6379"
    # A2.1: nelmio_cors.yaml resolves this at container-compile time
    # (allow_origin: ['%env(CORS_ALLOWED_ORIGIN_REGEX)%']), so it must exist
    # even though no browser ever calls the API in this job - an undefined
    # value throws EnvNotFoundException on every request, not just CORS
    # preflights. This was missing from the very first pipeline that
    # introduced nelmio/cors-bundle and broke every job since (found via
    # the GitLab API: last green pipeline predates it, HealthControllerTest
    # itself was failing with 500s).
    CORS_ALLOWED_ORIGIN_REGEX: "^http://localhost:8123$"
    APP_ENV: test
    JWT_PASSPHRASE: ci_ephemeral_passphrase
  cache:
    key:
      files:
        - backend/composer.lock
    paths:
      - backend/vendor/
  before_script:
    # libpng/libjpeg/libfreetype + gd: phpoffice/phpspreadsheet (A2.3, XLSX
    # export) hard-requires ext-gd - kept in sync with docker/backend/Dockerfile
    # by hand (see README pitfall #9: this job's image is generic php:8.4-cli,
    # nothing here is inherited from the Dockerfile automatically).
    - apt-get update && apt-get install -y --no-install-recommends git unzip libpq-dev libicu-dev libzip-dev zip libpng-dev libjpeg-dev libfreetype6-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install pdo pdo_pgsql intl opcache zip gd
    # A3.5: pcov (not xdebug - coverage-only, much faster) - deliberately
    # only installed here, never in docker/backend/Dockerfile: coverage
    # instrumentation has no business in an image that also serves live
    # traffic (dev, prod, or otherwise).
    - pecl install pcov && docker-php-ext-enable pcov
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - cd backend
    - composer install --no-interaction --no-progress --prefer-dist
    - mkdir -p config/jwt
    - php bin/console lexik:jwt:generate-keypair --overwrite
    - php bin/console doctrine:database:create --if-not-exists
    - php bin/console doctrine:migrations:migrate --no-interaction
    # --colors=never: GitLab's coverage regex below matches plain text: an
    # earlier local run with ANSI colors on made a "Lines: 77.00%" line
    # visually clear in a terminal but wrapped it in escape codes that a
    # simple regex has no business trying to strip.
    #
    # -d memory_limit=512M: php:8.4-cli's own default php.ini caps memory
    # at 128M, which FundingExportTest::testExportBeyondTheThresholdReturns202WithAPendingJobInstead
    # (A2.3) exhausts building its seeded dataset - "Fatal error: Allowed
    # memory size of 134217728 bytes exhausted ... UnitOfWork.php" -
    # confirmed live: this was already failing every CI run since
    # 2026-09-01 (before pcov/coverage even existed here), invisible until
    # someone actually opened a job's log rather than trusting the badge.
    # 512M matches what this same suite peaks at locally with coverage
    # enabled (measured live: 353MB) - comfortable headroom, not a guess.
    - php -d memory_limit=512M bin/phpunit --colors=never --coverage-text --coverage-cobertura=coverage.cobertura.xml
  coverage: '/^\s*Lines:\s*\d+\.\d+\%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.cobertura.xml

# Audit pre-production 2026-09-23 (P0) : ai/tests/ (6 fichiers) et
# pipeline/tests/ (28 fichiers) n'etaient executes par aucune CI, seulement
# manuellement sur un Codespace de developpement - decouvert pendant
# l'audit (voir docs/superpowers/specs/2026-09-23-audit-production.md).
ai_tests:
  stage: test
  image: python:3.12-slim
  variables:
    # Jamais reellement lu : chaque test qui appelle get_connection() le
    # mocke (unittest.mock.patch) - fourni par prudence si un futur test
    # important le module sans mocker completement.
    AI_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_unused"
    GEMINI_API_KEY: "ci_ephemeral_unused_key"
  before_script:
    - cd ai
    - pip install --no-cache-dir -r requirements.txt
  script:
    - cd ..
    - python -m pytest ai/tests/ -v

# Limite assumee (documentee, pas cachee) : sur 28 fichiers, seuls les 21
# qui ne touchent ni une vraie base Postgres ni le package `airflow`
# tournent ici. test_funding_validator.py/test_emission_validator.py
# ecrivent reellement en base (necessiteraient un service Postgres +
# migrations Doctrine appliquees dans ce job) et les 5 fichiers
# test_dag_*_tasks.py importent `airflow` directement (package lourd, non
# present dans pipeline/requirements.txt par design - voir le
# docker-compose.yml, seul le conteneur `airflow` l'installe). Exclus
# explicitement plutot que de pretendre une couverture qu'on n'a pas.
pipeline_tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd pipeline
    - pip install --no-cache-dir -r requirements.txt
  script:
    - cd ..
    - >
      python -m pytest pipeline/tests/ -v -m "not live"
      --ignore=pipeline/tests/test_funding_validator.py
      --ignore=pipeline/tests/test_emission_validator.py
      --ignore=pipeline/tests/test_dag_afdb_tasks.py
      --ignore=pipeline/tests/test_dag_extraction_pdf_tasks.py
      --ignore=pipeline/tests/test_dag_gcf_tasks.py
      --ignore=pipeline/tests/test_dag_pnue_tasks.py
      --ignore=pipeline/tests/test_dag_worldbank_tasks.py

# Construit et publie l'image Docker sur le Container Registry GitLab.
# Ce n'est PAS un déploiement : rien ne récupère ni ne fait tourner cette
# image automatiquement. Le déploiement réel est la tâche A3.8.
build_and_push_image:
  stage: build
  image: docker:27-cli
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  services:
    - docker:27-dind
  # Ce needs suppose que le job phpunit n'a pas de "rules" qui l'exclurait
  # d'un pipeline donné (il tourne sur toute branche, sans condition) - s'il
  # en gagne une un jour, needs doit être revu en même temps, sinon la
  # création du pipeline échoue sur les branches où phpunit est exclu.
  needs: ["phpunit"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "developp"'
  # 2026-09-16 : quota de minutes CI GitLab du groupe épuisé
  # (failure_reason: "ci_quota_exceeded", voir point d'attention #61 du
  # README) - ce job n'est pas un déploiement (voir le commentaire
  # au-dessus de "build_and_push_image" : rien ne récupère ni ne fait
  # tourner cette image automatiquement, Render/Netlify se déploient
  # depuis le code source, indépendamment de ce registre), donc son échec
  # ne doit plus faire échouer le pipeline dans son ensemble et masquer le
  # vrai signal de qualité (phpunit). À retirer si le quota était la seule
  # raison de cette ligne et qu'un autre échec de ce job doit à nouveau
  # bloquer le pipeline.
  allow_failure: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/backend:developp" -f docker/backend/Dockerfile .
    - docker run --rm "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" php -v
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend:developp"
